<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap');

    svg {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100%;
      height: 100%;
    }
    svg text.main-text {
      animation: stroke 5s infinite alternate;
      stroke-width: 2;
      stroke: #50649D;
      font-size: 80px;
      font-weight: 700;
    }
    .sub-text {
      font-size: 13px;
      font-weight: 500;
      fill: #50649D;
      opacity: 0.8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    @keyframes stroke {
      0% {
        fill: rgba(80, 100, 157, 0);
        stroke: rgba(80, 100, 157, 1);
        stroke-dashoffset: 25%;
        stroke-dasharray: 0 50%;
        stroke-width: 2;
      }
      70% {
        fill: rgba(80, 100, 157, 0);
        stroke: rgba(80, 100, 157, 1);
      }
      80% {
        fill: rgba(80, 100, 157, 0);
        stroke: rgba(80, 100, 157, 1);
        stroke-width: 3;
      }
      100% {
        fill: rgba(80, 100, 157, 1);
        stroke: rgba(80, 100, 157, 0);
        stroke-dashoffset: -25%;
        stroke-dasharray: 50% 0;
        stroke-width: 0;
      }
    }
  </style>
  <text class="main-text" x="50%" y="70" dy=".35em" text-anchor="middle">
    SCRIPT BOT
  </text>
  <text class="sub-text" x="50%" y="125" text-anchor="middle">
    ©Powered by Muaz
  </text>
</svg>
